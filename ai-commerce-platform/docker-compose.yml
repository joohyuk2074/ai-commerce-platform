services:
  # E-commerce Service Dependencies
  mysql:
    image: mysql:8.0
    container_name: sparta-ecommerce-mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Seoul
    volumes:
      - sparta-ecommerce-mysql-volume:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - sparta-ecommerce-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sparta-ecommerce-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - sparta-ecommerce-redis-volume:/data
    command: redis-server --appendonly yes
    networks:
      - sparta-ecommerce-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Kafka (KRaft mode - without Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sparta-ecommerce-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
      - "9093:9093"
    environment:
      # KRaft 설정
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 리스너 설정 (내부: kafka:9092, 외부: localhost:9094)
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      # 클러스터 설정
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # 로그 설정
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - sparta-ecommerce-kafka-volume:/var/lib/kafka/data
    networks:
      - sparta-ecommerce-network
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ELK Stack for Log Management
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: sparta-ecommerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - sparta-ecommerce-elasticsearch-volume:/usr/share/elasticsearch/data
    networks:
      - sparta-ecommerce-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  es-init:
    image: alpine:3.19
    container_name: sparta-ecommerce-es-init
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./logstash/templates:/templates:ro
      - ./logstash/scripts:/scripts:ro
    environment:
      - ELASTICSEARCH_HOST=elasticsearch:9200
    networks:
      - sparta-ecommerce-network
    command: >
      sh -c "
        apk add --no-cache curl jq bash &&
        bash /scripts/init-templates.sh
      "
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: sparta-ecommerce-logstash
    depends_on:
      - elasticsearch
      - kafka
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    networks:
      - sparta-ecommerce-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: sparta-ecommerce-kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - sparta-ecommerce-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-ui:
    image: redpandadata/console:latest
    container_name: sparta-ecommerce-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092
    networks:
      - sparta-ecommerce-network
    restart: unless-stopped


volumes:
  # E-commerce Service Volumes
  sparta-ecommerce-mysql-volume:
    name: sparta-ecommerce-mysql-volume
  sparta-ecommerce-redis-volume:
    name: sparta-ecommerce-redis-volume
  sparta-ecommerce-kafka-volume:
    name: sparta-ecommerce-kafka-volume
  sparta-ecommerce-elasticsearch-volume:
    name: sparta-ecommerce-elasticsearch-volume

networks:
  sparta-ecommerce-network:
    name: sparta-ecommerce-network
    driver: bridge