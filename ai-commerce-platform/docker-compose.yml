services:
  # E-commerce Service Dependencies
  mysql:
    image: mysql:8.0
    container_name: sparta-ecommerce-mysql
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Seoul
    volumes:
      - sparta-ecommerce-mysql-volume:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - sparta-ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sparta-ecommerce-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - sparta-ecommerce-redis-volume:/data
    command: redis-server --appendonly yes
    networks:
      - sparta-ecommerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  # E-commerce Service Volumes
  sparta-ecommerce-mysql-volume:
    name: sparta-ecommerce-mysql-volume
  sparta-ecommerce-redis-volume:
    name: sparta-ecommerce-redis-volume

networks:
  sparta-ecommerce-network:
    name: sparta-ecommerce-network
    driver: bridge