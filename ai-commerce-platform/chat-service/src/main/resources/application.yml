server:
  port: 8081

spring:
  application:
    name: sparta-llm
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/teamsparta_vector
    username: rtan
    password: sparta
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 2048
        distance-type: cosine  # COSINE_DISTANCE → cosine
        index-type: hnsw
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5-20250929  # or claude-opus-4.1
          temperature: 0.7
          max-tokens: 4096
    ollama:
      base-url: http://localhost:11434  # OLLAMA 서버 주소*
      chat:
        options:
          model: qwen2.5:3b              # 사용할 모델*
          temperature: 0.7               # 창의성 (0.0 ~ 1.0)
          num-predict: 1000              # 최대 생성 토큰 수# 로깅 설정 (선택사항)
          keep-alive: 5m
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
