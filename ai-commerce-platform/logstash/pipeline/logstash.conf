input {
  # Kafka에서 로그 수신
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["application-logs"]
    codec => json
    group_id => "logstash-consumer-group"
    consumer_threads => 3
    decorate_events => true
  }
}

filter {
  # JSON 파싱
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  # 타임스탬프 파싱
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }
  }

  # 서비스 이름 추가 (Kafka topic이나 메시지에서 추출)
  if [service] {
    mutate {
      add_field => { "service_name" => "%{service}" }
    }
  }

  # 로그 레벨 정규화
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  # 환경 정보 추가
  mutate {
    add_field => {
      "environment" => "dev"
      "platform" => "sparta-ecommerce"
    }
  }
}

output {
  # Elasticsearch로 전송
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "sparta-ecommerce-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # 디버깅용 stdout (선택사항)
  stdout {
    codec => rubydebug
  }
}
