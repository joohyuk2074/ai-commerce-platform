input {
  # Kafka에서 로그 수신
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["application-logs", "audit-logs"]
    codec => json
    group_id => "logstash-consumer-group"
    consumer_threads => 3
    decorate_events => true
  }
}

filter {
  # 토픽별 태그 추가
  if [@metadata][kafka][topic] == "audit-logs" {
    mutate {
      add_tag => ["audit"]
    }
  } else {
    mutate {
      add_tag => ["application"]
    }
  }

  # JSON 파싱
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  # 감사 로그 전용 필터
  if "audit" in [tags] {
    # HTTP 메서드 정규화
    if [method] {
      mutate {
        uppercase => ["method"]
      }
    }

    # API 엔드포인트 분류 (이미 service, resource 필드가 있음)
    if [path] and ![service] {
      grok {
        match => { "path" => "^/(?<service>[^/]+)(?:/(?<resource>[^/]+))?" }
        tag_on_failure => []
      }
    }

    # 응답 시간 성능 등급
    if [responseTime] {
      ruby {
        code => '
          response_time = event.get("responseTime").to_i
          if response_time < 100
            event.set("performance", "excellent")
          elsif response_time < 500
            event.set("performance", "good")
          elsif response_time < 1000
            event.set("performance", "acceptable")
          else
            event.set("performance", "poor")
          end
        '
      }
    }

    # HTTP 상태코드 분류
    if [statusCode] {
      ruby {
        code => '
          status = event.get("statusCode").to_i
          if status >= 200 && status < 300
            event.set("status_category", "success")
          elsif status >= 300 && status < 400
            event.set("status_category", "redirect")
          elsif status >= 400 && status < 500
            event.set("status_category", "client_error")
          elsif status >= 500
            event.set("status_category", "server_error")
          end
        '
      }
    }

    # IP 정보 GeoIP (선택사항, geoip 플러그인 필요)
    # if [clientIp] {
    #   geoip {
    #     source => "clientIp"
    #     target => "geoip"
    #   }
    # }

    # 민감 정보 마스킹 (query string의 password 등)
    if [query] {
      mutate {
        gsub => [
          "query", "password=[^&]*", "password=***",
          "query", "token=[^&]*", "token=***",
          "query", "apiKey=[^&]*", "apiKey=***"
        ]
      }
    }

    # User-Agent 파싱 (useragent 플러그인 필요)
    if [userAgent] {
      useragent {
        source => "userAgent"
        target => "ua"
      }
    }
  }

  # 애플리케이션 로그 필터
  if "application" in [tags] {
    # 서비스 이름 추가
    if [service] {
      mutate {
        add_field => { "service_name" => "%{service}" }
      }
    }

    # 로그 레벨 정규화
    if [level] {
      mutate {
        uppercase => ["level"]
      }
    }
  }

  # 타임스탬프 파싱
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # 공통 메타데이터
  mutate {
    add_field => {
      "environment" => "dev"
      "platform" => "sparta-ecommerce"
    }
  }
}

output {
  # 감사 로그는 별도 인덱스로
  if "audit" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "audit-logs-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # 애플리케이션 로그
  if "application" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "application-logs-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # 디버깅용 stdout (개발 환경에서만 사용)
  stdout {
    codec => rubydebug
  }
}
