# Grafana Datasource 프로비저닝 설정
# 역할: Grafana 시작 시 자동으로 데이터소스 추가

apiVersion: 1

# 기존 데이터소스 삭제 설정
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Jaeger
    orgId: 1
  - name: Elasticsearch
    orgId: 1

# 데이터소스 목록
datasources:
  # Prometheus - 메트릭 데이터
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Prometheus 설정
      timeInterval: '15s'
      # Exemplar 활성화 (메트릭 -> 트레이스 연결)
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
    version: 1
    uid: prometheus

  # Jaeger - 분산 추적 데이터
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      # Trace to logs 연결 설정
      tracesToLogs:
        datasourceUid: 'elasticsearch'
        tags: ['job', 'instance', 'pod', 'namespace']
        mappedTags: [{ key: 'service.name', value: 'service' }]
        mapTagNamesEnabled: true
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
    version: 1
    uid: jaeger

  # Elasticsearch - 로그 데이터
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: 'logstash-*'
    editable: true
    jsonData:
      # Elasticsearch 버전
      esVersion: '8.11.0'
      # 시간 필드
      timeField: '@timestamp'
      # 로그 레벨 필드
      logLevelField: 'level'
      # 로그 메시지 필드
      logMessageField: 'message'
      # 최대 동시 쿼리 수
      maxConcurrentShardRequests: 5
      # Trace to logs 연결을 위한 설정
      includeFrozen: false
      # interval 설정
      interval: 'Daily'
    version: 1
    uid: elasticsearch

  # Elasticsearch - Jaeger 스팬 데이터 (선택사항)
  - name: Elasticsearch-Jaeger
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: 'jaeger-span-*'
    editable: true
    jsonData:
      esVersion: '8.11.0'
      timeField: 'startTime'
      maxConcurrentShardRequests: 5
      interval: 'Daily'
    version: 1
    uid: elasticsearch-jaeger
