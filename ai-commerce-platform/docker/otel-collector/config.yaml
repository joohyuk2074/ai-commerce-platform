# OpenTelemetry Collector 설정
# 역할: 분산 추적 데이터를 수집하고 처리한 후 Jaeger/Elasticsearch로 전송

receivers:
  # OTLP (OpenTelemetry Protocol) 수신기
  # Spring Boot 애플리케이션으로부터 텔레메트리 데이터를 받음
  otlp:
    protocols:
      # gRPC 프로토콜 (고성능, 권장)
      grpc:
        endpoint: 0.0.0.0:4317
      # HTTP 프로토콜 (방화벽 환경)
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

processors:
  # 배치 프로세서: 성능 최적화를 위해 여러 span을 묶어서 전송
  batch:
    timeout: 10s              # 10초마다 또는
    send_batch_size: 1024     # 1024개가 모이면 전송
    send_batch_max_size: 2048

  # 메모리 제한: OOM 방지
  memory_limiter:
    check_interval: 1s
    limit_mib: 512            # 최대 512MB 메모리 사용
    spike_limit_mib: 128

  # 리소스 탐지: 서비스 정보 자동 추가
  resourcedetection:
    detectors: [env, system, docker]
    timeout: 5s

  # 속성 추가: 추가 메타데이터 삽입
  resource:
    attributes:
      - key: environment
        value: ${ENVIRONMENT:-development}
        action: upsert
      - key: project
        value: ai-commerce-platform
        action: upsert

  # Span 메트릭 생성: 트레이스로부터 메트릭 추출
  spanmetrics:
    metrics_exporter: prometheus
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: service.name

exporters:
  # Jaeger 익스포터: 분산 추적 데이터를 Jaeger로 전송
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Elasticsearch 익스포터: 트레이스 데이터를 Elasticsearch에 직접 저장
  # (Jaeger가 이미 Elasticsearch에 저장하므로 선택사항)
  # elasticsearch:
  #   endpoints: [http://elasticsearch:9200]
  #   traces_index: otel-traces
  #   logs_index: otel-logs

  # Prometheus 익스포터: 메트릭을 Prometheus 형식으로 노출
  prometheus:
    endpoint: 0.0.0.0:8889

  # 로깅 익스포터: 디버깅용 (개발 환경)
  logging:
    loglevel: info
    sampling_initial: 5      # 처음 5개 로그
    sampling_thereafter: 200 # 그 이후 200개마다 1개

  # Kafka 익스포터: 트레이스를 Kafka로 전송 (선택사항)
  # kafka:
  #   brokers: [kafka:9092]
  #   topic: otel-traces
  #   encoding: otlp_proto

# 확장: 헬스체크 및 모니터링
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

# 서비스 파이프라인: 데이터 흐름 정의
service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    # 트레이스 파이프라인
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp/jaeger, logging]

    # 메트릭 파이프라인
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [prometheus, logging]

    # 로그 파이프라인 (선택사항)
    # logs:
    #   receivers: [otlp]
    #   processors: [memory_limiter, resourcedetection, resource, batch]
    #   exporters: [elasticsearch, logging]

  # 텔레메트리: Collector 자체 모니터링
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
