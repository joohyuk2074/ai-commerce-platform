server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: Authentication
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:8080"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            # ============================================
            # Authentication & User Management Routes
            # ============================================
            # Public: 회원가입, 로그인 (auth-service로 라우팅)
            - id: auth-public
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/auth/**
              metadata:
                access-level: public
                description: "Authentication endpoints (signup, login, token refresh)"

            # Authenticated: 사용자 정보 조회/수정/삭제
            - id: users
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users/**
              metadata:
                access-level: authenticated
                description: "User management endpoints"

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

auth:
  default-strategy: passport

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-must-be-at-least-256-bits-long}
  issuer: ai-commerce-platform

services:
  ecommerce:
    url: http://localhost:8082
  auth:
    url: http://localhost:8083

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
    com.spartaecommerce.gateway: DEBUG
