server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: Authentication
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:8080"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            # ============================================
            # Authentication & User Management Routes
            # ============================================
            # Public: 회원가입, 로그인
            - id: auth-public
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/auth/**
              metadata:
                access-level: public
                description: "Authentication endpoints (signup, login)"

            # Authenticated: 사용자 정보 조회/수정/삭제
            - id: users
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users/**
              metadata:
                access-level: authenticated
                description: "User management endpoints"

            # ============================================
            # Product & Category Routes
            # ============================================
            # Products: GET은 public, POST/PATCH/DELETE는 admin
            - id: products
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/products/**
              metadata:
                access-level: public-read-admin-write
                description: "Product management (public read, admin write)"

            # Categories: GET은 public, POST/PATCH/DELETE는 admin
            - id: categories
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/categories/**
              metadata:
                access-level: public-read-admin-write
                description: "Category management (public read, admin write)"

            # ============================================
            # Shopping Cart Routes
            # ============================================
            # Authenticated: 사용자 자신의 장바구니만 접근 가능
            - id: cart-items
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/cart-items/**
              metadata:
                access-level: authenticated
                description: "Shopping cart operations (user owns cart)"

            # ============================================
            # Order Management Routes
            # ============================================
            # Authenticated: 사용자 자신의 주문만 접근 가능
            - id: orders
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/orders/**
              metadata:
                access-level: authenticated
                description: "Order operations (user owns order)"

            # ============================================
            # Point Wallet Routes
            # ============================================
            # Authenticated: 사용자 자신의 포인트만 접근 가능
            - id: points
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/points/**
              metadata:
                access-level: authenticated
                description: "Point wallet operations (user owns points)"

            # ============================================
            # Refund Routes
            # ============================================
            # Authenticated: 사용자 자신의 환불만 접근 가능
            - id: refunds
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/refunds/**
              metadata:
                access-level: authenticated
                description: "Refund operations (user owns refund)"

            # ============================================
            # Chat Service Routes
            # ============================================
            - id: chat-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/chat/**
              filters:
                - StripPrefix=2
              metadata:
                access-level: authenticated
                description: "Chat service endpoints"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always

# Authentication Configuration
auth:
  # 인증 방식 선택: session (현재) 또는 jwt (향후)
  strategy: session

# Backend Services Configuration
services:
  ecommerce:
    url: http://localhost:8082

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
    com.spartaecommerce.gateway: DEBUG
